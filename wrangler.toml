# Reflex edge worker (reflex#15 iteration 3).
#
# DEPLOY GATES (DD-122): before any production traffic this deployment must
# be declared in the principal's sovereignty policy (trusted_substrates)
# and the Activation-Payload at-rest rule (declared residency acceptance vs
# principal-key encryption) must be decided. Until then: dev/preview only.
#
# D1 migrations: reuse the repo's drizzle/ SQL —
#   bunx wrangler d1 migrations apply reflex --remote
# (the drizzle/*.sql files are the migration source for BOTH drivers).

name = "reflex-edge"
main = "src/edge/worker.ts"
compatibility_date = "2026-06-01"
# No nodejs_compat: since myelin#190 (./edge subpath) the wrangler dry-run
# bundle greps clean for ALL previously-observed Node surfaces —
# @nats-io/transport-node, node:fs, node:net, node:os, node:path,
# node:tls (each 0 occurrences). Keeping the flag off makes any future
# Node-only import fail loudly at build/deploy instead of riding a shim
# into production.

# Every distinct cron expression used by a schedule-kind Activation
# Blueprint MUST appear here — Cron Triggers are the clock; Reflex maps
# the fired expression back to blueprints by STRING equality (canonical
# forms only). The DO /status route (internal) reports blueprint
# expressions so drift is visible (EdgeScheduleSource.unmatchedExpressions);
# a firing that matches zero blueprints warns loudly.
[triggers]
crons = ["0 7 * * *"]

[[d1_databases]]
binding = "REFLEX_DB"
database_name = "reflex"
database_id = "00000000-0000-0000-0000-000000000000" # set per account
# Without this, `wrangler d1 migrations apply` has no migration source —
# the drizzle/ SQL files are shared by the bun:sqlite and D1 drivers.
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "REFLEX_BLUEPRINTS"
id = "00000000000000000000000000000000" # set per account

[durable_objects]
bindings = [
  { name = "REFLEX_CONSUMER", class_name = "ReflexConsumer" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReflexConsumer"]

[vars]
REFLEX_PRINCIPAL = "jc"
REFLEX_STACK = "default"
# The hub's WebSocket listener (DD-70: port 9222 on the Cloudflare hub).
REFLEX_NATS_WS_URL = "wss://hub.invalid:9222"

# Secrets (wrangler secret put):
#   REFLEX_NATS_CREDS   — inline .creds file CONTENT (myelin credsContent)
#   <token bindings>    — one per http blueprint's token_env
