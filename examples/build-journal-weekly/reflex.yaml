# Schedule-kind Activation Blueprint: fire the public build journal every Sunday
# evening, laptop offline. Reflex owns the clock (internal heartbeat / DO alarm —
# no Cloudflare Cron consumed); the schedule Impulse is an internal cron tick
# validated by the same croner that runs it.
#
# Pairs with the cortex F-6 reflex-activation bridge. End to end:
#   Sunday 18:00 Europe/Zurich  →  reflex fires  →  cortex bridge  →
#   tasks.@…build-journal.run  →  the pulse P_BUILD_JOURNAL pipeline runs
#   (gather facts → draft → federated review ×2 → humanize → publish),
#   posting to public Discord and deploying stack.meta-factory.ai/build-log/.
#
# Target: `@jc/build-journal` — resolved by the cortex `reflex_activation`
# bridge to a cortex `capability` + `assistant`. Reflex never runs the flow
# itself; the `target` is an opaque Execution Blueprint ref that cortex maps.
# Required cortex config (cortex#1188) — a DETERMINISTIC in-process code handler
# (like `notify.discord`), NOT an LLM session, because the run git-pushes +
# deploys a public site unattended. A code-handler target sets `handler:`, never
# `prompt:` (mutually exclusive):
#
#   reflex_activation.targets:
#     - target: "@jc/build-journal"
#       capability: "build-journal.run"
#       assistant: cortex               # required by schema; ignored for code handlers
#       handler: "build-journal"        # → createBuildJournalRunner
#   build_journal:                      # top-level block (sibling of notify:)
#     pulse_repo: /abs/path/to/pulse
#     days_default: 7
#
# The `days`/`post`/`deploy` Activation Payload below is the handler's input,
# so the cortex handler runs the equivalent of:
#   bun examples/build-journal/run-journal.ts --llm --days 7 --post --deploy
#
# Deploy (reflex-edge): schedule blueprints need NO GitHub delivery and NO HMAC
# secret — load straight into KV:
#   1. Deploy reflex-edge (or rely on the next heartbeat KV refresh).
#   2. Load this blueprint into KV (one document per key under `activation/`):
#        wrangler kv key put --binding=REFLEX_BLUEPRINTS \
#          activation/build-journal-weekly "$(cat examples/build-journal-weekly/reflex.yaml)"
#
# See docs/deploy-build-journal-weekly.md for the cortex-prod handler + config.
schema: metafactory/activation/v1
activations:
  - id: build-journal-weekly
    target: "@jc/build-journal"      # cortex maps → capability build-journal.run, assistant sage
    when:
      schedule: "0 18 * * 0"         # Sunday 18:00 — cron, validated by the croner that runs it
      timezone: Europe/Zurich        # IANA timezone; DST handled by croner
    policy: auto                     # auto-fire (no Activation Approval needed)
    guards:
      cooldown: 12h                  # collapse any same-evening double-fire; well under the weekly cadence
      run_lock: skip                 # a tick during an in-flight run is Blocked (no concurrent journal runs)
    payload:
      days: 7                        # journal period: the week since the last Sunday run
      post: true                     # post the teaser to public Discord
      deploy: true                   # commit + push site repo, wrangler deploy to stack.meta-factory.ai
