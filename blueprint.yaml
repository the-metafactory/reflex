schema: blueprint/v1
repo: reflex

# Reflex — activation runtime (formerly cue; renamed 2026-06-10).
# Feature graph per docs/design-reflex-v0.md. R-100 supersedes the C-1 spec feature.

features:
  # Iteration 1 — Reflex v0 MVP
  - id: R-100
    name: "Reflex v0 design doc + repo bootstrap"
    status: done
    iteration: 1
    issue: 1
    depends: []
    description: "Design session output: docs/design-reflex-v0.md capturing daemon architecture, full decision pipeline (decision/policy/approval/guards/event), wire rename mf.{net}.reflex.activation.>, config surfaces, storage, CLI. Supersedes cue-era C-1."

  - id: R-101
    name: "Myelin transport integration"
    status: done
    iteration: 1
    depends: []
    description: "Consume @the-metafactory/myelin (git-pinned): NATSTransport + InMemoryTransport + request-reply + MyelinEnvelope + derived subjects. src/bus/ wrapper, envelope builders for reflex.activation.* types, ensureStream, config file + env overrides, fail-fast startup, bounded publish queue. bun test offline; integration suite on local NATS. Supersedes CloudEvents/DD-68 framing (decision 22)."

  - id: R-102
    name: "Config loader + schema + hot-reload"
    status: done
    iteration: 1
    depends: [R-101]
    description: "metafactory/activation/v1 zod schema. Load reflex.yaml sidecars from configured roots + ~/.config/reflex/activations/*.yaml, merged; duplicate blueprint id = load error. File watcher hot-reloads blueprint set atomically; Matched Decisions for removed blueprints expire with reason blueprint-removed. reflex validate works daemon-less."

  - id: R-103
    name: "SQLite storage (Drizzle)"
    status: done
    iteration: 1
    depends: []
    description: "Tables: decisions, approvals, guard_state, fired_events at ~/.local/state/reflex/reflex.db. Ignored decisions stored as per-blueprint counters, not rows."

  - id: R-104
    name: "Decision pipeline core"
    status: planned
    iteration: 1
    depends: [R-102, R-103]
    description: "Impulse -> rule evaluation -> Activation Decision (ignored/matched/blocked/fired/denied/expired) -> policy (auto/approval/disabled) -> guards (cooldown, run lock with skip|buffer conflict modes, idempotency key) -> Activation Event publish to mf.{net}.reflex.activation.fired.{target}. Decision audit events on mf.{net}.reflex.activation.decision.{outcome}. Dry Run produces a Dry Run Verdict: no guard mutation, no events, not in decision history."

  - id: R-105
    name: "Schedule impulse source (cron)"
    status: planned
    iteration: 1
    depends: [R-104]
    description: "Internal impulse source: cron expressions with timezone (croner). Drives schedule-kind blueprints."

  - id: R-106
    name: "Manual fire + approval flow"
    status: planned
    iteration: 1
    depends: [R-104]
    description: "reflex fire <blueprint-id> --input json as programmatic impulse. Approval lifecycle: matched decisions wait, reflex approve/deny <decision-id>, per-blueprint approval_timeout (default 1h) resolves to an Expired Decision; deny produces a Denied Decision."

  - id: R-107
    name: "CLI over NATS request/reply"
    status: planned
    iteration: 1
    depends: [R-101, R-103]
    description: "reflex status/list/fire/approve/deny/pending/history/test/validate. Daemon serves mf.{net}.reflex.cmd.> request/reply; CLI is a thin NATS client. Cortex can issue identical commands later."

  - id: R-108
    name: "Bus impulse source (subscription + matcher)"
    status: planned
    iteration: 1
    depends: [R-104]
    description: "Per-blueprint NATS subject subscriptions; match = subject pattern + flat field-equals conditions on CloudEvents data. No expression language in v0. Also consumes mf.{net}.pulse.run.> outcomes for Run Lock release and Buffered Impulse re-presentation."

  - id: R-109
    name: "Minimal http impulse source"
    status: planned
    iteration: 1
    depends: [R-104]
    description: "Localhost HTTP endpoint auto-generated per http-kind blueprint (POST /hook/{blueprint-id}), bearer-token auth only. External impulse source. Windmill pattern, deliberately minimal."

  - id: R-110
    name: "Example activation blueprints"
    status: planned
    iteration: 1
    depends: [R-105, R-106, R-108]
    description: "Three committed examples: F_PR_STATS daily schedule, Pilot 30-min scan (bus + approval), F_TESTING manual impulse. Serve as living docs and integration-test fixtures."
